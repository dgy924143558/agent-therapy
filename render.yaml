# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# No plan is set, so Render uses its smallest paid instance (a disk needs a paid one).
# A disk also keeps the service at a single instance, which SQLite needs anyway.
# Region can't be changed after creation (oregon, ohio, virginia, frankfurt, singapore).
services:
  - type: web
    name: agent-therapy
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Deploy only after GitHub CI passes.
    autoDeployTrigger: checksPass
    envVars:
      - key: AGENT_THERAPY_DB
        value: /data/agent_therapy.db
      - key: AGENT_THERAPY_TRUST_PROXY
        value: "1"
    disk:
      name: agent-therapy-data
      mountPath: /data
      sizeGB: 1
